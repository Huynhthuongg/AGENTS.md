[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-project-compiler-agent"
version = "0.1.1"
description = "Termux-first compiler agent that turns requirements into runnable project scaffolds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Universal Project Compiler Agent Maintainers" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "httpx>=0.28,<1.0",
  "httpx2>=2.3,<3.0",
  "codespell>=2.3,<3.0"
]

[project.scripts]
upca = "universal_compiler_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/universal_compiler_agent/server.py" = ["E501"]
"app/universal_compiler_agent/templates.py" = ["E501"]

[tool.codespell]
skip = "*.png,.git,.pytest_cache,.ruff_cache,.venv"
ignore-words-list = "thi"
